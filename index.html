<style>

:root{
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 20px; --radius-sm: 12px;
  --ease: cubic-bezier(.22,1,.36,1);
  --sidebar: 264px;
}
html[data-theme="dark"]{
  --bg:#070a13; --bg2:#0b1020;
  --card: rgba(255,255,255,.035); --card-solid:#0f1526; --card-hover: rgba(255,255,255,.055);
  --border: rgba(255,255,255,.075); --border-strong: rgba(255,255,255,.14);
  --text:#eef1f8; --text2:#b4bccd; --muted:#8a94a8;
  --accent:#3fe0b8; --accent-strong:#12b48e; --accent-soft: rgba(63,224,184,.14);
  --mint:#4ade80; --mint-soft: rgba(74,222,128,.13);
  --danger:#ff6b81; --danger-soft: rgba(255,107,129,.13);
  --warn:#ffb547; --warn-soft: rgba(255,181,71,.14);
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 20px 50px -20px rgba(0,0,0,.6);
  --shadow-lg: 0 40px 100px -20px rgba(0,0,0,.75);
  --grid: rgba(255,255,255,.06);
  --input: rgba(255,255,255,.045);
  --blob1: rgba(20,199,154,.22); --blob2: rgba(56,189,248,.10); --blob3: rgba(132,204,22,.07);
}
html[data-theme="light"]{
  --bg:#f3f5fa; --bg2:#eef1f8;
  --card: rgba(255,255,255,.72); --card-solid:#ffffff; --card-hover: rgba(255,255,255,.92);
  --border: rgba(15,23,42,.07); --border-strong: rgba(15,23,42,.14);
  --text:#0d1326; --text2:#3a4358; --muted:#5d667b;
  --accent:#0f8f74; --accent-strong:#0b7a63; --accent-soft: rgba(15,143,116,.1);
  --mint:#15803d; --mint-soft: rgba(21,128,61,.1);
  --danger:#dc2650; --danger-soft: rgba(220,38,80,.09);
  --warn:#9a5800; --warn-soft: rgba(217,130,0,.12);
  --shadow: 0 1px 2px rgba(15,23,42,.04), 0 18px 40px -22px rgba(15,23,42,.22);
  --shadow-lg: 0 40px 90px -25px rgba(15,23,42,.35);
  --grid: rgba(15,23,42,.07);
  --input: rgba(15,23,42,.035);
  --blob1: rgba(13,148,136,.16); --blob2: rgba(14,165,233,.07); --blob3: rgba(14,165,233,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-size:14px;line-height:1.5;letter-spacing:-.005em;transition:background-color .5s var(--ease), color .3s var(--ease);overflow-x:hidden}
.bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-fx i{position:absolute;border-radius:50%;filter:blur(90px);transition:background .6s}
.bg-fx i:nth-child(1){width:620px;height:620px;left:-140px;top:-220px;background:var(--blob1);animation:float1 22s ease-in-out infinite}
.bg-fx i:nth-child(2){width:520px;height:520px;right:-160px;top:20%;background:var(--blob2);animation:float2 26s ease-in-out infinite}
.bg-fx i:nth-child(3){width:480px;height:480px;left:35%;bottom:-260px;background:var(--blob3);animation:float1 30s ease-in-out infinite reverse}
.bg-fx::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--grid) 1px, transparent 1px);background-size:28px 28px;mask-image:linear-gradient(to bottom, rgba(0,0,0,.5), transparent 70%);-webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,.5), transparent 70%)}
@keyframes float1{50%{transform:translate(60px,40px) scale(1.08)}}
@keyframes float2{50%{transform:translate(-50px,60px) scale(1.05)}}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--border);background:linear-gradient(180deg, var(--card), transparent);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%)}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 22px}
.brand-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#a7f3d0,#12b48e 50%,#38bdf8);box-shadow:0 8px 24px -6px rgba(20,199,154,.6), inset 0 1px 0 rgba(255,255,255,.35)}
.brand-name{font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand-sub{font-size:11.5px;color:var(--muted);letter-spacing:.02em;margin-top:-2px}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:10px 12px 6px;font-weight:600}
.nav-btn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--text2);font-weight:500;position:relative;transition:background .25s var(--ease), color .25s, transform .2s var(--ease);text-align:left;width:100%}
.nav-btn:hover{background:var(--card-hover);color:var(--text)}
.nav-btn:active{transform:scale(.98)}
.nav-btn.active{background:var(--accent-soft);color:var(--text)}
.nav-btn.active::before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav-btn.active svg{color:var(--accent)}
.nav-btn .count{margin-left:auto;font-size:11.5px;color:var(--muted);background:var(--input);padding:1px 8px;border-radius:999px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.side-card{padding:14px;border-radius:16px;border:1px solid var(--border);background:var(--card);font-size:12.5px;color:var(--muted)}
.side-card strong{display:block;color:var(--text);font-size:13px;margin-bottom:2px}
.theme-switch{display:flex;padding:4px;border-radius:12px;background:var(--input);border:1px solid var(--border);position:relative}
.theme-switch button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--muted);position:relative;z-index:1;transition:color .3s}
.theme-switch button[aria-pressed="true"]{color:var(--text)}
.theme-switch .pill{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);border-radius:9px;background:var(--card-solid);box-shadow:0 2px 8px rgba(0,0,0,.18);transition:transform .45s var(--ease)}
html[data-theme="light"] .theme-switch .pill{transform:translateX(100%)}
.ghost-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--muted);font-size:13px;font-weight:500;transition:.2s}
.ghost-btn:hover{color:var(--text);background:var(--card-hover)}
main{padding:28px 36px 48px;min-width:0;max-width:1480px;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}
.topbar h1{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
.topbar .sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.top-actions{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:600;font-size:13.5px;transition:transform .2s var(--ease), box-shadow .3s var(--ease), background .2s, opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-strong));box-shadow:0 10px 28px -10px var(--accent), inset 0 1px 0 rgba(255,255,255,.22)}
html[data-theme="dark"] .btn-primary{background:linear-gradient(135deg,#12b48e,#0a8c75)}
.btn-primary:hover{box-shadow:0 14px 34px -10px var(--accent), inset 0 1px 0 rgba(255,255,255,.22);transform:translateY(-1px)}
.btn-secondary{background:var(--input);border:1px solid var(--border);color:var(--text)}
.btn-secondary:hover{background:var(--card-hover);border-color:var(--border-strong)}
.btn-danger{color:#fff;background:linear-gradient(135deg,#f0506b,#d93355);box-shadow:0 10px 26px -12px #ff4d6d}
.kbd{font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.2);margin-left:2px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:.2s var(--ease)}
.icon-btn:hover{color:var(--text);border-color:var(--border-strong);transform:translateY(-1px)}
.mobile-only{display:none!important}
.view{display:none}
.view.active{display:block;animation:viewIn .6s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);padding:22px;transition:border-color .3s, background .5s, transform .35s var(--ease), box-shadow .35s var(--ease);animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms);min-width:0}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.card-title{font-size:15px;font-weight:600;letter-spacing:-.01em}
.card-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.link-btn{font-size:12.5px;font-weight:600;color:var(--accent);padding:6px 10px;border-radius:9px;transition:.2s;white-space:nowrap}
.link-btn:hover{background:var(--accent-soft)}
.span-3{grid-column:span 3}.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
.kpi{overflow:hidden;padding:20px 20px 18px}
@media (hover:hover){.kpi:hover{transform:translateY(-3px);border-color:var(--border-strong)}}
.kpi-top{display:flex;align-items:center;gap:10px;color:var(--text2);font-size:13px;font-weight:500}
.kpi-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.kpi-val{font-size:27px;font-weight:700;letter-spacing:-.035em;margin:14px 0 8px;white-space:nowrap;position:relative;z-index:1}
.kpi-val .cur{font-size:15px;font-weight:600;color:var(--muted);margin-right:5px;letter-spacing:0}
.kpi-foot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);position:relative;z-index:1}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip svg.i{width:13px;height:13px;stroke-width:2.2}
.chip.up{color:var(--mint);background:var(--mint-soft)}
.chip.down{color:var(--danger);background:var(--danger-soft)}
.chip.neutral{color:var(--text2);background:var(--input)}
.spark{position:absolute;right:0;bottom:0;width:42%;height:54px;opacity:.85;pointer-events:none}
.kpi.hero{background:linear-gradient(135deg, rgba(20,199,154,.30), rgba(56,189,248,.12) 70%), var(--card);border-color:rgba(63,224,184,.25)}
html[data-theme="light"] .kpi.hero{background:linear-gradient(135deg, rgba(15,143,116,.13), rgba(12,154,114,.06) 70%), var(--card)}
.seg-ctl{display:inline-flex;padding:3px;border-radius:10px;background:var(--input);border:1px solid var(--border)}
.seg-ctl button{padding:5px 11px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted);transition:.25s var(--ease);white-space:nowrap}
.seg-ctl button[aria-pressed="true"]{background:var(--card-solid);color:var(--text);box-shadow:0 1px 6px rgba(0,0,0,.15)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--text2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.chart-wrap{position:relative;height:290px;margin:0 -6px}
.chart-wrap svg{display:block;width:100%;height:100%;overflow:visible}
.axis-label{fill:var(--muted);font-size:11.5px;font-family:var(--font)}
.chart-line{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chart-area{opacity:0;transition:opacity 1.2s var(--ease) .35s}
.chart-area.in{opacity:1}
.hover-line{stroke:var(--border-strong);stroke-width:1;stroke-dasharray:3 4;opacity:0;transition:opacity .2s}
.hover-dot{opacity:0;transition:opacity .2s}
.chart-tip{position:absolute;top:0;left:0;pointer-events:none;min-width:200px;padding:12px 14px;border-radius:14px;background:var(--card-solid);border:1px solid var(--border-strong);box-shadow:var(--shadow-lg);font-size:12.5px;opacity:0;transform:translateY(6px);transition:opacity .2s, transform .25s var(--ease);z-index:3}
.chart-tip.show{opacity:1;transform:none}
.chart-tip .t{font-weight:600;margin-bottom:8px}
.chart-tip .r{display:flex;justify-content:space-between;gap:16px;color:var(--text2);padding:2px 0}
.chart-tip .r b{color:var(--text);font-weight:600}
.chart-tip .r i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:7px}
.chart-tip hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.donut-box{display:flex;flex-direction:column;align-items:center;gap:18px}
.donut{position:relative;width:200px;height:200px;flex-shrink:0}
.donut svg{width:100%;height:100%;overflow:visible}
.donut .seg{transition:stroke-dasharray 1.1s var(--ease), stroke-width .25s var(--ease), opacity .25s;cursor:pointer}
.donut .seg.dim{opacity:.3}
.donut .seg.hl{stroke-width:28}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.donut-center .l{font-size:12px;color:var(--muted);font-weight:500}
.donut-center .v{font-size:19px;font-weight:700;letter-spacing:-.03em;margin-top:2px}
.donut-legend{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:2px 6px}
.donut-legend button{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text2);padding:5px 4px;border-radius:8px;text-align:left;transition:background .2s;min-width:0}
.donut-legend button span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.donut-legend button:hover{background:var(--card-hover)}
.donut-legend i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.donut-legend .p{margin-left:auto;color:var(--muted);font-weight:500;white-space:nowrap;padding-left:4px}
.tx-row{display:flex;align-items:center;gap:14px;padding:11px 10px;border-radius:14px;transition:background .2s, transform .35s var(--ease), opacity .35s;position:relative}
.tx-row:hover{background:var(--card-hover)}
.tx-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.tx-main{min-width:0;flex:1}
.tx-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{font-weight:600;font-size:14px;white-space:nowrap;text-align:right}
.tx-amt.pos{color:var(--mint)}
.tx-del{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);opacity:0;transition:.2s;flex-shrink:0}
.tx-row:hover .tx-del,.tx-del:focus-visible{opacity:1}
.tx-del:hover{color:var(--danger);background:var(--danger-soft)}
.tx-row.removing{opacity:0;transform:translateX(30px)}
.day-head{display:flex;justify-content:space-between;align-items:center;padding:18px 54px 6px 10px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.day-head:first-child{padding-top:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.search{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:var(--input);outline:none;transition:border-color .2s, box-shadow .2s, background .2s;font-size:14px}
.search .input{padding-left:42px}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin-bottom:10px}
.chips::-webkit-scrollbar{display:none}
.fchip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:12.5px;font-weight:500;color:var(--text2);white-space:nowrap;transition:.2s var(--ease)}
.fchip:hover{border-color:var(--border-strong);color:var(--text)}
.fchip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.fchip i{width:7px;height:7px;border-radius:50%}
.tx-summary{display:flex;gap:22px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:0 10px 8px}
.tx-summary b{color:var(--text);font-weight:600}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty .e-ico{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.bar{height:8px;border-radius:999px;background:var(--input);overflow:hidden;position:relative}
.bar>span{position:absolute;left:0;top:0;bottom:0;border-radius:999px;width:0;transition:width 1.2s var(--ease);overflow:hidden}
.bar>span::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-100%);animation:shine 2.4s ease-in-out 1.1s 1}
@keyframes shine{to{transform:translateX(100%)}}
.b-row{padding:11px 0}
.b-row+.b-row{border-top:1px solid var(--border)}
.b-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;font-size:13.5px}
.b-name{display:flex;align-items:center;gap:10px;font-weight:600;min-width:0}
.b-name .dot{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.b-name .dot svg{width:15px;height:15px}
.b-amt{color:var(--muted);font-size:12.5px;white-space:nowrap}
.b-amt b{color:var(--text);font-weight:600}
.budget-card .b-big{font-size:22px;font-weight:700;letter-spacing:-.03em;margin:14px 0 2px}
.budget-card .b-of{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.budget-card .b-foot{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.budget-card .b-foot b{font-weight:600;white-space:nowrap}
.budget-card .b-foot span{min-width:0}
.status-ok{color:var(--mint)}.status-warn{color:var(--warn)}.status-over{color:var(--danger)}
@media (hover:hover){.budget-card:hover,.goal-card:hover{transform:translateY(-3px);border-color:var(--border-strong)}}
.edit-btn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:.2s}
.edit-btn:hover{color:var(--text);background:var(--card-hover)}
.summary-strip{display:flex;gap:36px;flex-wrap:wrap;align-items:center}
.summary-strip .s-item .l{font-size:12.5px;color:var(--muted)}
.summary-strip .s-item .v{font-size:22px;font-weight:700;letter-spacing:-.03em}
.ring{position:relative;flex-shrink:0}
.ring svg{transform:rotate(-90deg);display:block}
.ring .track{stroke:var(--input)}
html[data-theme="dark"] .ring .track{stroke:rgba(255,255,255,.07)}
html[data-theme="light"] .ring .track{stroke:rgba(15,23,42,.07)}
.ring .prog{transition:stroke-dashoffset 1.4s var(--ease)}
.ring .rc{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;letter-spacing:-.02em}
.goal-mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.goal-mini .g{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:12px 6px;border-radius:16px;transition:background .2s}
.goal-mini .g:hover{background:var(--card-hover)}
.goal-mini .gn{font-size:13px;font-weight:600;line-height:1.3}
.goal-mini .gs{font-size:12px;color:var(--muted)}
.goal-card{display:flex;flex-direction:column;gap:18px}
.goal-top{display:flex;gap:18px;align-items:center}
.goal-name{font-size:16px;font-weight:600;letter-spacing:-.01em}
.goal-date{font-size:12.5px;color:var(--muted);margin-top:2px}
.goal-amt{font-size:20px;font-weight:700;letter-spacing:-.03em;margin-top:8px}
.goal-amt span{font-size:12.5px;color:var(--muted);font-weight:500;letter-spacing:0;display:block}
.goal-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal-stats>div{padding:10px 12px;border-radius:12px;background:var(--input);border:1px solid var(--border)}
.goal-stats .l{font-size:11.5px;color:var(--muted)}
.goal-stats .v{font-size:13.5px;font-weight:600}
.goal-actions{display:flex;gap:8px}
.goal-actions .btn{flex:1;padding:10px}
.add-card{border:1.5px dashed var(--border-strong);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);min-height:280px;font-weight:600;box-shadow:none;backdrop-filter:none}
.add-card:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.add-card .plus{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.acc{display:flex;align-items:center;gap:14px;padding:11px 4px}
.acc+.acc{border-top:1px solid var(--border)}
.acc .tx-ico{width:38px;height:38px}
.acc-total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 4px 0;margin-top:4px;border-top:1px solid var(--border-strong);font-weight:600}
.acc-total .v{font-size:18px;font-weight:700;letter-spacing:-.02em}
.modal-root{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;visibility:hidden;transition:visibility 0s .45s}
.modal-root.open{visibility:visible;transition:none}
.modal-backdrop{position:absolute;inset:0;background:rgba(3,6,14,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .35s var(--ease)}
.modal-root.open .modal-backdrop{opacity:1}
.modal{position:relative;width:min(480px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--card-solid);border:1px solid var(--border-strong);border-radius:24px;box-shadow:var(--shadow-lg);padding:26px;opacity:0;transform:translateY(18px) scale(.97);transition:opacity .35s var(--ease), transform .45s var(--ease)}
.modal-root.open .modal{opacity:1;transform:none}
.modal h2{font-size:19px;font-weight:700;letter-spacing:-.02em}
.modal .m-sub{color:var(--muted);font-size:13px;margin-top:4px}
.m-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
.field{margin-bottom:16px}
.field label,.field .lbl{display:block;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:7px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.amount-input{position:relative}
.amount-input span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-weight:600;color:var(--muted)}
.amount-input .input{padding-left:58px;font-size:24px;font-weight:700;letter-spacing:-.02em;padding-top:14px;padding-bottom:14px}
.type-toggle{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:var(--input);border:1px solid var(--border);position:relative;margin-bottom:18px}
.type-toggle button{padding:10px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--muted);z-index:1;display:flex;gap:8px;align-items:center;justify-content:center;transition:color .3s}
.type-toggle button[aria-pressed="true"]{color:var(--text)}
.type-toggle .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px;background:var(--card-hover);border:1px solid var(--border-strong);transition:transform .45s var(--ease)}
.type-toggle.income .pill{transform:translateX(100%)}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat-opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 4px;border-radius:13px;border:1px solid var(--border);background:var(--input);font-size:11.5px;font-weight:500;color:var(--text2);transition:.2s var(--ease);text-align:center;line-height:1.2}
.cat-opt:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.cat-opt[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb, var(--c) 14%, transparent);color:var(--text)}
.cat-opt .ci{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.m-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.m-actions .btn{min-width:120px}
.err{color:var(--danger);font-size:12px;margin-top:6px}
.err:empty{display:none}
.input.invalid{border-color:var(--danger);box-shadow:0 0 0 4px var(--danger-soft);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:-4px}
.color-pick{display:flex;gap:10px}
.color-pick button{width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid transparent;transition:.2s;box-shadow:0 0 0 1px var(--border)}
.color-pick button[aria-pressed="true"]{border-color:var(--card-solid);box-shadow:0 0 0 2px var(--c)}
html[data-theme="dark"] input[type="date"]{color-scheme:dark}
html[data-theme="light"] input[type="date"]{color-scheme:light}
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-radius:14px;background:var(--card-solid);border:1px solid var(--border-strong);box-shadow:var(--shadow-lg);font-size:13.5px;font-weight:500;animation:toastIn .5s var(--ease)}
.toast .t-ico{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--mint-soft);color:var(--mint);flex-shrink:0}
.toast .t-ico svg{width:14px;height:14px;stroke-width:2.6}
.toast button{color:var(--accent);font-weight:600;padding:4px 8px;border-radius:8px}
.toast button:hover{background:var(--accent-soft)}
.toast.out{animation:toastOut .35s var(--ease) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.96)}}
.bottom-nav{display:none}

  .kpis>.card{grid-column:span 6}
  .span-8.chart-card,.span-4.donut-card{grid-column:span 12}
  .donut-box{flex-direction:row;align-items:center;gap:40px}
  .donut-legend{flex:1}
  .budgets-grid>.card{grid-column:span 4}

  .kpis>.card{grid-column:span 6}

  .summary-strip{gap:18px 28px}

  .bottom-nav{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;padding:8px;border-radius:22px;border:1px solid var(--border-strong);box-shadow:var(--shadow-lg);justify-content:space-around;align-items:center;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  html[data-theme="dark"] .bottom-nav{background:rgba(15,21,38,.88)}
  html[data-theme="light"] .bottom-nav{background:rgba(255,255,255,.9)}
  .bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:6px 4px;border-radius:14px;transition:.2s;min-width:60px}
  .bottom-nav button.active{color:var(--accent);background:var(--accent-soft)}
  .bottom-nav .fab-in{width:48px;height:48px;border-radius:16px;min-width:48px;padding:0;justify-content:center;color:#fff;background:linear-gradient(135deg,#12b48e,#0a8c75);box-shadow:0 10px 24px -8px var(--accent)}
  .bottom-nav .fab-in svg{width:22px;height:22px}
  .modal-root{place-items:end center;padding:0}
  .modal{border-radius:24px 24px 0 0;width:100%;max-height:92vh;padding:22px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%)}

/* ===== iOS / PWA ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none;background:var(--bg)}
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
button,a,label,input,select,textarea,[role="button"]{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
body.modal-open{overflow:hidden}
.modal{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;max-height:calc(100dvh - 40px)}
.sb-bg{display:none}
@media (display-mode: standalone){
  html[data-theme="light"] .sb-bg{display:block;position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:#0d1326;z-index:45}
}
.sidebar{padding-top:calc(22px + env(safe-area-inset-top));padding-left:calc(16px + env(safe-area-inset-left))}
main{padding-top:calc(28px + env(safe-area-inset-top));padding-right:calc(36px + env(safe-area-inset-right))}
@media (pointer:coarse){ .input{font-size:16px} }
input[type="date"].input{-webkit-appearance:none;appearance:none;min-height:46px;line-height:1.3;display:block;text-align:left;font-variant-numeric:tabular-nums}
input[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type="date"]::-webkit-calendar-picker-indicator{opacity:.65;cursor:pointer}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;padding:0;margin:-1px}
@media (hover:none){
  .card:hover,.kpi:hover,.budget-card:hover,.goal-card:hover,.add-card:hover,.btn:hover,.icon-btn:hover,.g:hover,.nav-btn:hover{transform:none!important}
}
/* Lange Texte */
.goal-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;min-width:0}
.goal-mini .gn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.toast{max-width:min(560px,calc(100vw - 32px))}
.toast>span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.toast.warn .t-ico{background:var(--warn-soft);color:var(--warn)}
.status-none{color:var(--muted)}
.goal-date.overdue{color:var(--warn);font-weight:600}
.tx-rcpt{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:11px;color:var(--accent);background:var(--accent-soft);transition:transform .2s var(--ease)}
.tx-rcpt:active{transform:scale(.92)}
.tx-rcpt svg{width:17px;height:17px}
.tx-meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Sekundär-Button oben */
.btn-scan{background:var(--card);border:1px solid var(--border-strong);color:var(--text)}
.btn-scan svg{color:var(--accent)}
.icon-btn.accent{background:linear-gradient(135deg,#12b48e,#0a8c75);color:#fff;border-color:transparent;box-shadow:0 8px 20px -8px var(--accent)}
/* Install-Hinweis */
.install-hint{display:flex;gap:14px;align-items:center;padding:14px 16px;margin-bottom:12px;border-radius:18px;border:1px solid var(--border-strong);background:linear-gradient(135deg,var(--accent-soft),transparent 70%),var(--card)}
.install-hint .ih-ico{width:40px;height:40px;border-radius:12px;flex:none;background:url(apple-touch-icon.png) center/cover;box-shadow:0 6px 16px -6px rgba(0,0,0,.5)}
.install-hint .ih-t{font-weight:600;font-size:13.5px}
.install-hint .ih-s{color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.45}
.install-hint .ih-s svg{width:14px;height:14px;vertical-align:-2px;color:var(--accent)}
.install-hint .icon-btn{flex:none;width:34px;height:34px}
.m-reset{display:none;margin:22px auto 0;color:var(--muted);font-size:13px;font-weight:500;padding:10px 14px;border-radius:12px}
.m-reset svg{width:15px;height:15px;vertical-align:-3px;margin-right:6px}
@media (max-width:900px){ .m-reset{display:block} }
.cat-grid .cat-opt{min-height:44px}
@media (max-width:900px){
  main{padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(112px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
  .bottom-nav{left:calc(12px + env(safe-area-inset-left));right:calc(12px + env(safe-area-inset-right))}
  .modal{max-height:calc(100dvh - env(safe-area-inset-top) - 10px)}
  .toasts{bottom:calc(100px + env(safe-area-inset-bottom))}
}
/* Performance auf Mobilgeräten: keine animierten Blur-Ebenen hinter Glas-Karten */
@media (max-width:900px),(pointer:coarse){
  .bg-fx i{animation:none;filter:blur(70px)}
  .card{backdrop-filter:none;-webkit-backdrop-filter:none;background:color-mix(in srgb,var(--card-solid) 94%,transparent)}
  .add-card{background:transparent}
}
/* Perf: weiche Hintergrund-Flächen per Verlauf statt teurem Blur-Filter */
.bg-fx i{filter:none!important;will-change:transform}
.bg-fx i:nth-child(1){background:radial-gradient(closest-side,var(--blob1),var(--blob1) 30%,transparent 100%)}
.bg-fx i:nth-child(2){background:radial-gradient(closest-side,var(--blob2),var(--blob2) 30%,transparent 100%)}
.bg-fx i:nth-child(3){background:radial-gradient(closest-side,var(--blob3),var(--blob3) 30%,transparent 100%)}
/* hidden-Attribut darf nie durch display-Regeln überschrieben werden */
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* ===== v3: eigene Kategorien, Konten, Onboarding, Einstellungen ===== */
.span-12{grid-column:1/-1}
.btn-sm{padding:8px 13px;font-size:12.5px;border-radius:10px;gap:6px}
.btn-ghost-danger{color:var(--danger);background:transparent;border:1px solid color-mix(in srgb,var(--danger) 35%,transparent);margin-right:auto}
.btn-ghost-danger:hover{background:var(--danger-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:saturate(.5)}
.soft-empty{color:var(--muted);font-size:13px;line-height:1.55}
.soft-empty .link-btn{padding:2px 4px;margin-left:2px}
.empty .btn{margin:16px auto 0;display:inline-flex}
.field .hint{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.45}
.field .opt{font-weight:500;color:var(--muted);margin-left:4px;font-size:11.5px}
.m-text{color:var(--text2);line-height:1.6;margin:0 0 14px}
button.acc{width:100%;text-align:left;border-radius:12px;transition:background .2s}
@media (hover:hover){button.acc:hover{background:var(--input)}}
.acc .tx-amt{margin-left:auto}
.acc-edit{color:var(--muted);display:grid;place-items:center;margin-left:4px}
/* Diagramm-Platzhalter */
.chart-empty{position:absolute;inset:0 0 30px 48px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;color:var(--muted);font-size:13px;padding:20px;pointer-events:none}
.chart-empty b{color:var(--text);font-size:15px}
.chart-empty span:last-child{max-width:300px;line-height:1.5}
.chart-empty .ce-ico{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:6px}
/* Onboarding */
.onb{margin-bottom:20px;padding:26px;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--card)),var(--card) 55%,color-mix(in srgb,var(--mint) 10%,var(--card)))}
.onb::before{content:"";position:absolute;width:280px;height:280px;right:-90px;top:-120px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 35%,transparent),transparent);pointer-events:none}
.onb-x{position:absolute;top:14px;right:14px;z-index:1}
.onb-head{display:flex;gap:16px;align-items:flex-start;position:relative}
.onb-head h2{margin:2px 0 6px;font-size:22px;letter-spacing:-.02em}
.onb-head p{margin:0;color:var(--text2);font-size:13.5px;line-height:1.55;max-width:560px}
.onb.done .onb-head{align-items:center}.onb.done .onb-head>div{flex:1}
.onb-kicker{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.onb-mark{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#a7f3d0,#0a8c75 55%,#38bdf8);box-shadow:0 10px 28px -10px #0a8c75}
.onb-prog{height:4px;border-radius:4px;background:var(--input);margin:20px 0 14px;overflow:hidden}
.onb-prog span{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--mint));transition:width .8s var(--ease)}
.onb-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.onb-steps button{width:100%;display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--input);text-align:left;transition:.2s var(--ease);min-height:64px}
@media (hover:hover){.onb-steps li:not(.ok) button:hover{border-color:var(--accent);transform:translateY(-1px)}}
.onb-steps .cur button{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 10%,var(--input))}
.os-n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--card-solid);border:1px solid var(--border-strong);color:var(--text2)}
.cur .os-n{background:var(--accent);border-color:var(--accent);color:#fff}
.ok .os-n{background:var(--mint);border-color:var(--mint);color:#06281d}
.os-t{flex:1;min-width:0}.os-t b{display:block;font-size:13.5px}.os-t small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.ok .os-t b{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--text2)}
.os-go{color:var(--muted)}
/* Grosse Leerzustände */
.big-empty{text-align:center;padding:44px 24px}
.big-empty .be-ico{width:64px;height:64px;margin:0 auto 16px;border-radius:20px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.big-empty .be-ico .i{width:28px;height:28px}
.big-empty h3{margin:0 0 8px;font-size:19px}
.big-empty p{margin:0 auto 20px;max-width:460px;color:var(--text2);line-height:1.6;font-size:14px}
.be-sugg{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:18px}
/* Kategorien */
.cats-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.cats-sum{color:var(--text2);font-size:14px}.cats-sum b{color:var(--text);font-size:18px;margin-right:4px}
.cat-sec{margin-bottom:26px}
.cat-sec h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.cat-sec h3 span{background:var(--input);border:1px solid var(--border);border-radius:999px;padding:1px 8px;font-size:11px;letter-spacing:0;color:var(--text2)}
.cat-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:12px}
.cat-card{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px}
.cc-ico{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center}
.cc-main{flex:1;min-width:0}
.cc-name{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-meta{color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-amt{text-align:right;font-weight:600;font-size:13.5px;white-space:nowrap}.cc-amt small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.cat-card .icon-btn{flex:none;width:36px;height:36px}
.cat-prev{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--input);border:1px solid var(--border);margin-bottom:18px}
.cp-n{flex:1;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-t{font-size:11.5px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:3px 9px}
.seg-wide{display:flex;width:100%}.seg-wide button{flex:1;padding:9px 10px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.color-pick{flex-wrap:wrap}
.icon-pick{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.icon-pick button{aspect-ratio:1;min-height:38px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--border);background:var(--input);color:var(--text2);transition:.15s}
.icon-pick button[aria-pressed="true"]{border-color:var(--c,var(--accent));color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent)}
.check-row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:13px;border:1px solid var(--border);background:var(--input);cursor:pointer;margin-bottom:6px}
.check-row input,.radio-row input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.check-row b,.radio-row b{display:block;font-size:13.5px}.check-row small,.radio-row small{display:block;color:var(--muted);font-size:12px;margin-top:2px;line-height:1.45}
.radio-list{display:grid;gap:10px;margin-bottom:8px}
.radio-row{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--input);cursor:pointer}
.radio-row:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--input))}
.radio-row>span{flex:1;min-width:0}.radio-row select{margin-top:10px;width:100%}
/* Formular: Kategorie anlegen inline */
.cat-new{border-style:dashed!important;color:var(--accent)!important}.cat-new .ci{background:var(--accent-soft);color:var(--accent)}
.inl-cat{margin-top:10px}
.inl-hint{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;border-radius:12px;background:var(--accent-soft);color:var(--text2);font-size:12.5px;line-height:1.5;margin-bottom:10px}
.inl-hint .i{color:var(--accent);flex:none;margin-top:2px}
.inl-row{display:flex;gap:8px}.inl-row .input{flex:1;min-width:0}.inl-row .btn{flex:none}
.acc-pick{display:flex;flex-wrap:wrap;gap:8px}
.acc-pick .fchip{padding:9px 14px;font-size:13px}
/* Einstellungen */
.set-sec{margin-bottom:18px}
.set-list .acc{padding:11px 8px}
.set-note{display:flex;gap:9px;align-items:flex-start;color:var(--text2);font-size:13px;line-height:1.55;margin:0 0 14px}.set-note .i{flex:none;margin-top:2px;color:var(--mint)}
.set-actions{display:flex;flex-wrap:wrap;gap:10px}
.danger-zone{border-color:color-mix(in srgb,var(--danger) 35%,var(--border))}
.danger-zone .card-title{color:var(--danger)}
.dz-row{display:flex;align-items:center;gap:16px;justify-content:space-between}
.dz-row b{display:block;font-size:14px}.dz-row small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.5;max-width:480px}
.dz-row .btn{flex:none}
.wipe-warn{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--danger-soft);color:var(--text2);margin-bottom:16px;line-height:1.55;font-size:13.5px}
.wipe-warn .i{flex:none;color:var(--danger);margin-top:2px}.wipe-warn p{margin:0}
.set-foot{text-align:center;color:var(--muted);font-size:12px;padding:8px 0 20px}
.more-tiles{display:none;gap:12px;grid-template-columns:1fr 1fr;margin-bottom:18px}
.more-tile{display:flex;align-items:center;gap:12px;padding:16px;text-align:left}
.more-tile>span:nth-child(2){flex:1;min-width:0}.more-tile b{display:block;font-size:14.5px}.more-tile small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.more-tile>.i{color:var(--muted)}
.mt-ico{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.b-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@media (max-width:900px){
  .more-tiles.mobile-only{display:grid!important}
  .onb{padding:20px}.onb-head h2{font-size:19px}.onb-mark{width:40px;height:40px}
  .onb-steps{grid-template-columns:1fr}
  .cat-list{grid-template-columns:1fr}
  .cat-card{padding:12px}.cc-amt{display:none}
  .icon-pick{grid-template-columns:repeat(6,1fr)}
  .dz-row{flex-direction:column;align-items:stretch}
  .cats-head .btn{padding:10px 14px}
  .chart-empty{inset:0 0 26px 40px}
}
@media (max-width:420px){.more-tiles{grid-template-columns:1fr}}
.grid>.card.span-12{grid-column:1/-1}
/* v3.1: Kontostand als Budget */
.summary-strip .s-sub{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);margin-top:3px}
.summary-strip .s-sub .i{color:var(--accent)}
.summary-strip .s-note{flex-basis:100%;font-size:12.5px;color:var(--text2);padding-top:12px;border-top:1px solid var(--border);line-height:1.5}
.bs-empty{display:flex;align-items:center;gap:14px;width:100%}
.bs-empty .be-ico{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.bs-empty>div{flex:1;min-width:0}.bs-empty b{display:block;font-size:14.5px}.bs-empty small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.5}
.opt-limit{font-size:12px;color:var(--muted);text-decoration:underline dotted;text-underline-offset:3px;padding:2px 0}
.opt-limit:hover{color:var(--accent)}
.b-total{padding-bottom:12px;margin-bottom:4px;border-bottom:1px solid var(--border)}
.b-total .b-sub{font-size:12px;color:var(--muted);margin-top:6px}
@media (max-width:900px){
  .bs-empty{flex-wrap:wrap}.bs-empty .btn{width:100%;justify-content:center}
  .summary-strip .s-item{min-width:calc(50% - 14px)}
  .seg-wide button{font-size:12.5px;padding:9px 6px}
}
.seg-wide button{white-space:normal;line-height:1.25;min-width:0;text-align:center}
.seg-wide button .i{flex:none}

.ps-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}
.ps-row label{font-weight:600;font-size:14px}
.ps-row select.input{width:auto;min-width:190px;max-width:100%;padding-right:34px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text2) 50%),linear-gradient(135deg,var(--text2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;font-size:16px}
.ps-info{margin:10px 0 0}
@media(max-width:560px){.ps-row select.input{width:100%}}
.kpi-lbl{display:flex;flex-direction:column;line-height:1.2;min-width:0}.kpi-lbl small{font-size:11.5px;opacity:.72;white-space:nowrap;margin-top:2px;font-variant-numeric:tabular-nums}
.ws-row{margin-top:14px}

/* ===== Kairos-spezifisch ===== */
:root{--s-kauf:#22c55e;--s-beob:#60a5fa;--s-halt:#14b8a6;--s-hot:#f59e0b;--s-meid:#f43f5e;--sky:#38bdf8}
[data-theme="light"]{--s-kauf:#16a34a;--s-beob:#2563eb;--s-halt:#0d9488;--s-hot:#d97706;--s-meid:#e11d48}
.pos{color:var(--mint)}.negv{color:var(--danger)}
.disc{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);padding:8px 12px;border:1px dashed var(--border-strong);border-radius:12px;margin:0 0 16px;line-height:1.4}
.disc svg{width:15px;height:15px;flex:none;color:var(--warn)}
.note-bar{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.45;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--text);margin:10px 0}
.note-bar svg{width:16px;height:16px;flex:none;margin-top:1px;color:var(--accent)}
.note-bar.warn{background:var(--warn-soft)}.note-bar.warn svg{color:var(--warn)}
.note-bar.ok{background:var(--mint-soft)}.note-bar.ok svg{color:var(--mint)}
.upd{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);white-space:nowrap}
.mkt-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.mkt{padding:12px;border-radius:14px;background:var(--input);border:1px solid var(--border);min-width:0;display:flex;flex-direction:column;gap:3px}
.mkt-h{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mkt-n{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkt-h .chip{font-size:11px;padding:2px 6px}
.mkt-v{font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.mkt-f{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spk{width:100%;height:34px;margin-top:4px}.spk polyline{fill:none}
.spk.up polyline{stroke:var(--mint)}.spk.down polyline{stroke:var(--danger)}
.sb{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:999px;white-space:nowrap;line-height:1.3}
.sb::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.sb.s-kauf{color:var(--s-kauf);background:color-mix(in srgb,var(--s-kauf) 15%,transparent)}
.sb.s-beob{color:var(--s-beob);background:color-mix(in srgb,var(--s-beob) 15%,transparent)}
.sb.s-halt{color:var(--s-halt);background:color-mix(in srgb,var(--s-halt) 15%,transparent)}
.sb.s-hot{color:var(--s-hot);background:color-mix(in srgb,var(--s-hot) 16%,transparent)}
.sb.s-meid{color:var(--s-meid);background:color-mix(in srgb,var(--s-meid) 14%,transparent)}
.mono{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:10.5px;font-weight:800;letter-spacing:-.02em;color:#fff;background:linear-gradient(135deg,#12b48e,#0a8c75);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.mono.etf{background:linear-gradient(135deg,#38bdf8,#2563eb)}
.mono.kr{background:linear-gradient(135deg,#f59e0b,#ea580c)}
.ir{display:flex;width:100%;text-align:left;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-radius:14px;transition:background .2s var(--ease);color:inherit}
.ir:hover{background:var(--card-hover)}
.ir+.ir{border-top:1px solid var(--border)}
.ir-l{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.ir-m{display:flex;flex-direction:column;min-width:0;gap:2px}
.ir-n{font-weight:650;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ir-s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ir-r{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.ir-p{font-weight:650;font-size:14px}
.ir-c{display:flex;gap:6px;align-items:center}
.ir-c .chip{font-size:11px;padding:2px 6px}
.tl{font-size:12px;margin-top:3px;color:var(--muted);white-space:normal}
.opp-grid,.opps{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.opp{display:flex;flex-direction:column;gap:12px;text-align:left;padding:14px;border-radius:16px;background:var(--input);border:1px solid var(--border);color:inherit;transition:transform .25s var(--ease),border-color .25s var(--ease)}
.opp:hover{transform:translateY(-2px);border-color:var(--accent)}
.opp-top{display:flex;align-items:center;gap:12px;min-width:0}
.opp-m{flex:1;min-width:0}
.opp-ev{text-align:right;flex:none}.opp-ev small{display:block;font-size:10.5px;color:var(--muted);font-weight:500}.opp-ev b{font-size:16px}
.opp-bar{display:flex;flex-wrap:wrap;gap:6px;font-size:11.5px}
.opp-bar span{padding:3px 8px;border-radius:8px;background:var(--card-solid);border:1px solid var(--border);color:var(--muted)}
.opp-bar .g{color:var(--mint)}.opp-bar .l{color:var(--danger)}.opp-bar .f{color:var(--warn)}
.soft-empty{padding:18px;border-radius:14px;border:1px dashed var(--border-strong);color:var(--muted);font-size:13.5px;line-height:1.5}
.soft-empty b{color:var(--text);display:block;margin-bottom:3px}
.dist{display:flex;height:12px;border-radius:999px;overflow:hidden;gap:2px;margin:6px 0 14px}
.dist span{min-width:4px}
.s-kauf{background:var(--s-kauf)}.s-beob{background:var(--s-beob)}.s-halt{background:var(--s-halt)}.s-hot{background:var(--s-hot)}.s-meid{background:var(--s-meid)}
.sb.s-kauf,.sb.s-beob,.sb.s-halt,.sb.s-hot,.sb.s-meid{background-image:none}
.dist-leg{display:flex;flex-direction:column;gap:2px}
.dist-leg button{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;text-align:left;color:inherit}
.dist-leg button:hover{background:var(--card-hover)}
.dist-leg i{width:10px;height:10px;border-radius:3px;flex:none}
.dist-leg span:nth-of-type(1){flex:1;display:flex;flex-direction:column;min-width:0}
.dist-leg small{font-size:11.5px;color:var(--muted)}
.dist-leg .num{text-align:right;font-weight:700}.dist-leg .num small{display:block;font-weight:500}
.tbl-wrap{overflow-x:auto;margin:0 -4px;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
.tbl th{text-align:right;font-weight:600;color:var(--muted);padding:8px 8px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:11.5px}
.tbl td{text-align:right;padding:8px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td:nth-child(2){text-align:right}
.tbl tr.tot td{font-weight:700;border-top:1px solid var(--border-strong)}
.kv{display:flex;flex-direction:column}
.kv>div{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.kv>div span{color:var(--muted)}.kv>div b{text-align:right;font-weight:600}
.sel-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.sel-row select{width:100%}
.pos-row{display:flex;align-items:center;gap:8px;padding:6px 0}
.pos-row+.pos-row{border-top:1px solid var(--border)}
.pos-main{flex:1;display:flex;align-items:center;gap:12px;min-width:0;padding:8px;border-radius:12px;text-align:left;color:inherit}
.pos-main:hover{background:var(--card-hover)}
.pos-r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;font-size:13px}
.pos-act{display:flex;gap:2px;flex:none}
.pos-h{font-size:12px;font-weight:600}
.pos-h.ok{color:var(--mint)}.pos-h.warn{color:var(--warn)}.pos-h.danger{color:var(--danger)}.pos-h.muted{color:var(--muted)}
.count.kz{background:var(--s-kauf);color:#04130d}
/* Detail */
.modal.wide{width:min(760px,100%)}
.m-hbtn{display:flex;gap:6px;flex:none}
.m-hbtn .icon-btn.on{color:var(--warn)}
.d-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 0 10px;flex-wrap:wrap}
.d-px{font-size:30px;font-weight:750;letter-spacing:-.03em;line-height:1.1}
.d-sub{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.d-sig{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.d-sc{font-size:13px;font-weight:700}.d-sc small{color:var(--muted);font-weight:500}
.d-x{font-size:14px;line-height:1.55;margin:0 0 14px;color:var(--text)}
.tbox{border-radius:18px;padding:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 12%,transparent),transparent 70%),var(--input);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--border))}
.tbox.none{background:var(--input);border-color:var(--border)}
.tbox p{font-size:13.5px;line-height:1.5;margin:8px 0 0}
.tb-h{display:flex;align-items:center;gap:8px;font-size:14.5px}
.tb-h svg{width:18px;height:18px;color:var(--accent);flex:none}
.cfd{margin-left:auto;font-size:11.5px;color:var(--muted);padding:3px 8px;border:1px solid var(--border);border-radius:999px;white-space:nowrap}
.tb-stake{display:flex;align-items:center;gap:10px;margin:12px 0 6px;flex-wrap:wrap}
.tb-stake label{font-size:13px;font-weight:600;color:var(--muted)}
.tb-stake .amount-input{max-width:170px}
.tb-main{font-size:16px;line-height:1.45;padding:10px 0 6px}
.tb-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.tb-grid>div{padding:9px 10px;border-radius:12px;background:var(--card-solid);border:1px solid var(--border);min-width:0}
.tb-grid small{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.tb-grid b{font-size:13.5px;font-weight:650}
.fees{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;font-size:12px;margin:6px 0}
.fees>div{display:flex;flex-direction:column}.fees span{color:var(--muted);font-size:11px}
.goalrow{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.45;margin-top:6px}
.goalrow svg{width:16px;height:16px;flex:none;color:var(--accent);margin-top:1px}
.fine{font-size:11.5px;color:var(--muted);line-height:1.45;margin:8px 0 0}
.link-btn{font-size:12.5px;color:var(--accent);font-weight:600}
.d-sec{margin-top:18px}
.d-sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;font-size:14.5px}
.chart{position:relative;height:220px;border-radius:14px;background:var(--input);border:1px solid var(--border);overflow:hidden;touch-action:pan-y}
.chart svg{width:100%;height:190px;display:block}
.chart .ln{fill:none;stroke-width:2}
.chart svg.up .ln{stroke:var(--mint)}.chart svg.down .ln{stroke:var(--danger)}
.chart svg.up .g0{stop-color:var(--mint);stop-opacity:.25}.chart svg.down .g0{stop-color:var(--danger);stop-opacity:.22}
.chart .g1{stop-color:var(--bg);stop-opacity:0}
.chart .hl{stroke-dasharray:5 5;stroke-width:1.2}.chart .hl.tg{stroke:var(--mint)}.chart .hl.sl{stroke:var(--danger)}
.chart .cx{stroke:var(--muted);stroke-width:1}
.hl-l{position:absolute;right:8px;transform:translateY(-120%);font-size:10.5px;font-weight:650;padding:1px 6px;border-radius:6px;background:var(--card-solid)}
.hl-l.tg{color:var(--mint)}.hl-l.sl{color:var(--danger)}
.c-ax{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:6px 10px}
.c-tip{position:absolute;top:8px;transform:translateX(-50%);font-size:12px;padding:4px 9px;border-radius:8px;background:var(--card-solid);border:1px solid var(--border-strong);box-shadow:var(--shadow);white-space:nowrap;pointer-events:none}
.chart-load{display:grid;place-items:center;height:100%;color:var(--muted);font-size:13px}
.ind{display:flex;flex-direction:column}
.ind-r{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.ind-r>div{flex:1;min-width:0}
.ind-r small{display:block;font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.ind-h{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;font-weight:600}
.ind-h b{white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
.dot.g{background:var(--mint)}.dot.b{background:var(--danger)}.dot.n{background:var(--muted);opacity:.6}
.sh-row{display:flex;gap:3px;flex-wrap:wrap}
.shd{width:14px;height:22px;border-radius:4px}
.sh-leg{font-size:12px;color:var(--muted);margin:8px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.yuh{padding:12px 14px;border-radius:14px;background:var(--warn-soft);font-size:13px;display:flex;flex-direction:column;gap:4px}
.yuh b{display:flex;gap:6px;align-items:center}.yuh small{color:var(--muted);line-height:1.45}
#reloadBtn.spin svg{animation:kspin 1s linear infinite}@keyframes kspin{to{transform:rotate(360deg)}}
@media (max-width:1100px){.mkt-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:720px){
 .mkt-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .sel-row{grid-template-columns:repeat(2,minmax(0,1fr))}
 .tb-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .fees{grid-template-columns:repeat(2,minmax(0,1fr))}
 .d-px{font-size:26px}
 .ir{padding:11px 4px}.mono{width:38px;height:38px}
 .ir-c .chip{display:none}
}
.tb-stake .amount-input{max-width:150px}
.tb-stake .amount-input span{left:12px;font-size:13px}
.tb-stake .amount-input .input{font-size:16px;padding:8px 10px 8px 48px}
select.input{appearance:none;-webkit-appearance:none;background-color:var(--input);color:var(--text);padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
select.input option{background:var(--card-solid);color:var(--text)}
@media (max-width:720px){select.input{font-size:16px}}
#listSum{display:block;font-size:12.5px;color:var(--muted);margin:10px 2px 6px;line-height:1.5}
#listSum b{color:var(--text)}
#listSum .link-btn{display:inline;padding:0}

</style>
</head>

/* ===== Kairos – Kern: Formate, Zustand, Gebühren, Daten ===== */
const APP_VERSION='1.0.0',SCHEMA=1,KEY='kairos.v1',THEME_KEY='kairos.theme',HINT_KEY='kairos.hint';
const IOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const ic=(n,style='')=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true"${style?` style="${style}"`:''}>${ICONS[n]||''}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONF=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const WD=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
function grp(n,dec=2){n=Number(n);if(!Number.isFinite(n))n=0;const f=Math.pow(10,dec);const v=Math.round((Math.abs(n)+1e-9)*f)/f;const [i,d]=v.toFixed(dec).split('.');return i.replace(/\B(?=(\d{3})+(?!\d))/g,'’')+(dec?'.'+d:'')}
const neg=(n,s)=>n<0&&Math.abs(n)>=.005?'−'+s:s;
function chf(n,dec=2){n=Number(n)||0;return neg(n,'CHF '+grp(n,dec))}
function chfS(n,dec=2){n=Number(n)||0;const s='CHF '+grp(n,dec);return n<0&&Math.abs(n)>=.005?'−'+s:'+'+s}
function money(n,ccy,dec){n=Number(n)||0;if(dec==null)dec=Math.abs(n)>=1000?2:Math.abs(n)>=1?2:4;return neg(n,ccy+' '+grp(n,dec))}
function pct(x,dec=1,sign=true){if(x==null||!Number.isFinite(x))return '–';const v=x*100;const s=grp(v,dec)+' %';return v<0&&Math.abs(v)>=Math.pow(10,-dec)/2?'−'+s:(sign&&v>0?'+'+s:s)}
const dmy=s=>{if(!s)return '–';const[y,m,d]=s.slice(0,10).split('-');return `${d}.${m}.${y}`};
function dateLong(d){return `${WD[d.getDay()]}, ${d.getDate()}. ${MONF[d.getMonth()]} ${d.getFullYear()}`}
const pad2=n=>String(n).padStart(2,'0');
function fmtStamp(iso){const d=new Date(iso);if(isNaN(d))return '–';const f=new Intl.DateTimeFormat('de-CH',{timeZone:'Europe/Zurich',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});return f.format(d).replace(',','')}
function ago(iso){const m=Math.round((Date.now()-new Date(iso))/60000);if(!Number.isFinite(m))return '';if(m<1)return 'gerade eben';if(m<60)return `vor ${m} Min.`;const h=Math.round(m/60);if(h<48)return `vor ${h} Std.`;return `vor ${Math.round(h/24)} Tagen`}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function parseAmt(s){s=String(s??'').replace(/[’'\s]/g,'').replace(',','.').replace(/^CHF/i,'');const n=parseFloat(s);return Number.isFinite(n)?n:NaN}

/* ---------- Lokaler Zustand (startet leer) ---------- */
const DEF={v:SCHEMA,watch:[],pos:[],settings:{stake:100,goal:20,risk:'ausgewogen'},stakes:{}};
const LOAD_WARN=[];
function sanitize(o){
  const s=JSON.parse(JSON.stringify(DEF));if(!o||typeof o!=='object')return s;
  for(const k of Object.keys(o))if(!(k in s))s[k]=o[k];
  s.watch=Array.isArray(o.watch)?[...new Set(o.watch.filter(x=>typeof x==='string'&&x.length<40))]:[];
  s.pos=Array.isArray(o.pos)?o.pos.filter(p=>p&&typeof p.t==='string'&&Number.isFinite(+p.stake)&&+p.stake>0&&Number.isFinite(+p.buy)&&+p.buy>0).map(p=>({id:String(p.id||uid()),t:p.t,stake:+p.stake,buy:+p.buy,fx:Number.isFinite(+p.fx)&&+p.fx>0?+p.fx:null,date:typeof p.date==='string'?p.date.slice(0,10):'',note:String(p.note||'').slice(0,200)})):[];
  const st=o.settings||{};s.settings={...s.settings,...st};
  s.settings.stake=clamp(Number.isFinite(+st.stake)&&+st.stake>0?+st.stake:100,10,1e6);
  s.settings.goal=clamp(Number.isFinite(+st.goal)&&+st.goal>0?+st.goal:20,1,1e5);
  if(!['vorsichtig','ausgewogen','offensiv'].includes(st.risk))s.settings.risk='ausgewogen';
  s.stakes={};if(o.stakes&&typeof o.stakes==='object')for(const[k,v]of Object.entries(o.stakes))if(Number.isFinite(+v)&&+v>=10&&+v<=1e6)s.stakes[k]=+v;
  return s}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
let S;
try{const raw=localStorage.getItem(KEY);if(raw){try{S=sanitize(JSON.parse(raw))}catch(e){try{localStorage.setItem(KEY+'.backup-'+Date.now(),raw)}catch(_){}S=sanitize(null);LOAD_WARN.push('Gespeicherte Daten waren beschädigt – Sicherung angelegt, neu gestartet.')}}else S=sanitize(null)}catch(e){S=sanitize(null)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Speichern nicht möglich (Speicher voll oder privat?)',null,'warn')}}

/* ---------- Yuh-Gebührenmodell (Werte aus signals.json, Fallback hier) ---------- */
let FEES={securities_tiers:[[10000,.005],[20000,.0035],[null,.0025]],securities_min:1,crypto_pct:.01,fx_pct:.0095,stamp_ch:.00075,stamp_foreign:.0015};
function feeParts(amount,o){
  if(amount<=0)return{comm:0,stamp:0,fx:0,total:0};
  if(o.kind==='Krypto'){const c=amount*FEES.crypto_pct;return{comm:c,stamp:0,fx:0,total:c}}
  let p=FEES.securities_tiers[FEES.securities_tiers.length-1][1];for(const[l,q]of FEES.securities_tiers){if(l==null||amount<=l){p=q;break}}
  const comm=Math.max(FEES.securities_min,amount*p),stamp=amount*(o.ch?FEES.stamp_ch:FEES.stamp_foreign),fx=o.fxfee?amount*FEES.fx_pct:0;
  return{comm,stamp,fx,total:comm+stamp+fx}}
const feeSide=(a,o)=>feeParts(a,o).total;
/* Einsatz inkl. Kaufgebühren; up/down als Anteil (0.05 = 5 %) */
function trade(stake,up,down,o){
  const fb=feeParts(stake,o),inv=stake-fb.total,vt=inv*(1+up),vs=inv*(1-down);
  const ft=feeParts(vt,o),fs=feeParts(vs,o);
  return{inv,fb,ft,fs,gain:vt-ft.total-stake,loss:vs-fs.total-stake,fees:fb.total+ft.total,gross:inv*up,grossLoss:-inv*down}}
function netAt(stake,ret,o){const fb=feeSide(stake,o),inv=stake-fb,v=inv*(1+ret);return v-feeSide(v,o)-stake}
function pSetup(o){const ps=DATA&&DATA.p_setup||{};return o.pl&&ps[o.pl.setup]||null}
/* Erwartungswert: Häufigkeiten Ziel/Stopp/Ablauf aus dem Rückblick-Test des Setups */
function ev(o,stake){if(!o.pl)return null;const p=pSetup(o);if(!p)return null;const t=trade(stake,o.pl.up,o.pl.dn,o);return p.pt*t.gain+p.ps*t.loss+p.pa*netAt(stake,p.ra||0,o)}
function stakeOf(o){return S.stakes[o.t]||S.settings.stake}
/* Gebührenanteil am Bruttogewinn (Ziel) */
function feeShare(o,s){const t=trade(s,o.pl.up,o.pl.dn,o);return t.gross>0?t.fees/t.gross:Infinity}
/* Struktureller Anteil: prozentuale Gebühren ohne Mindestgebühr (bei CHF 5'000) */
function floorShare(o){return o.pl?feeShare(o,5000):null}
/* Kleinster sinnvoller Einsatz: Gebühren <= 20 % des Bruttogewinns – oder, falls das wegen prozentualer
   Gebühren nie erreichbar ist, ab wo die Mindestgebühr den Anteil nicht mehr als 10 % verschlechtert */
function minStake(o){if(!o.pl)return null;const lim=Math.max(.2,floorShare(o)*1.1);for(let s=10;s<=50000;s+=s<200?10:s<1000?50:s<5000?250:1000){if(feeShare(o,s)<=lim)return s}return null}
/* Einsatz für einen Netto-Zielgewinn */
function stakeFor(o,goal){if(!o.pl)return null;if(trade(1e6,o.pl.up,o.pl.dn,o).gain<goal)return null;let lo=10,hi=1e6;if(trade(lo,o.pl.up,o.pl.dn,o).gain>=goal)return lo;for(let k=0;k<60;k++){const m=(lo+hi)/2;if(trade(m,o.pl.up,o.pl.dn,o).gain>=goal)hi=m;else lo=m}return Math.ceil(hi/5)*5}

/* ---------- Risikoprofil ---------- */
const PROFILES={vorsichtig:{l:'Vorsichtig',d:'Nur ruhige Titel (Volatilität unter 25 %), keine Krypto oder Krypto-ETPs, Chance/Risiko mindestens 2.',ok:o=>o.rk==='tief'&&o.ty!=='Krypto'&&o.pl&&o.pl.rr>=2},
  ausgewogen:{l:'Ausgewogen',d:'Ruhige und mittlere Schwankung (Volatilität bis 45 %), ohne stark schwankende Titel, Krypto und Krypto-ETPs. Standard.',ok:o=>o.rk!=='hoch'},
  offensiv:{l:'Offensiv',d:'Alle Signale inklusive stark schwankender Aktien und Krypto.',ok:()=>true}};
const fits=o=>PROFILES[S.settings.risk].ok(o);
const sigEff=o=>o.sig==='Kaufzone'&&!fits(o)?'Beobachten':o.sig;
const SIGS=[{k:'Kaufzone',c:'kauf',d:'Setup mit gutem Chance/Risiko'},{k:'Beobachten',c:'beob',d:'Noch kein klares Signal'},{k:'Halten',c:'halt',d:'Trend intakt, kein neuer Einstieg'},{k:'Überhitzt',c:'hot',d:'Stark gelaufen – Rücksetzer abwarten'},{k:'Meiden',c:'meid',d:'Abwärtstrend'}];
const sigCls=k=>(SIGS.find(s=>s.k===k)||SIGS[1]).c;
const SETUP_DE={rebound:'Erholung aus überverkaufter Lage',pullback:'Rücksetzer an die 50-Tage-Linie',breakout:'Ausbruch über Widerstand',momentum:'Momentum-Fortsetzung'};

/* ---------- Daten laden ---------- */
let DATA=null,BY={},LOADERR=null,FROMCACHE=false;
async function loadData(){
  try{const r=await fetch('data/signals.json',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
    FROMCACHE=r.headers.get('x-kairos-cache')==='1';const d=await r.json();if(!d||!Array.isArray(d.instruments))throw new Error('Ungültige Daten');
    DATA=d;BY={};d.instruments.forEach(o=>BY[o.t]=o);if(d.fees)FEES={...FEES,...d.fees};LOADERR=null;
  }catch(e){LOADERR=String(e.message||e)}
}
const HIST={};
async function loadHist(o){if(HIST[o.id])return HIST[o.id];try{const r=await fetch(`data/hist/${o.id}.json`);if(!r.ok)throw 0;HIST[o.id]=await r.json();return HIST[o.id]}catch(e){return null}}

const VIEWS=[
  {id:'dashboard',label:'Übersicht',icon:'grid',title:()=>greeting(),sub:()=>DATA?`Datenstand ${fmtStamp(DATA.generated)} (MEZ/MESZ) · ${DATA.count} Instrumente`:'Marktsignale für dein Yuh-Depot'},
  {id:'signals',label:'Signale',icon:'activity',title:()=>'Signale',sub:()=>DATA?`${DATA.count} bei Yuh handelbare Instrumente`:'Alle Instrumente'},
  {id:'watch',label:'Watchlist',icon:'star',title:()=>'Watchlist',sub:()=>S.watch.length?`${S.watch.length} beobachtet`:'Deine beobachteten Titel'},
  {id:'pos',label:'Positionen',icon:'briefcase',title:()=>'Meine Positionen',sub:()=>S.pos.length?`${S.pos.length} bei Yuh erfasst`:'Was du bei Yuh hältst'},
  {id:'settings',label:'Einstellungen',icon:'gear',title:()=>'Einstellungen',sub:()=>'Risikoprofil, Einsatz und Daten'}

function greeting(){const h=new Date().getHours();return (h<11?'Guten Morgen':h<18?'Guten Tag':'Guten Abend')+', CyberX'}

function buildNav(){
  const n=kzCount();

  const mob=[{id:'dashboard',l:'Übersicht',i:'grid'},{id:'signals',l:'Signale',i:'activity'},{id:'watch',l:'Watchlist',i:'star'},{id:'pos',l:'Positionen',i:'briefcase'},{id:'settings',l:'Mehr',i:'gear'}];
  $('#bottomNav').innerHTML=mob.map(v=>{const on=v.id===current;return `<button class="${on?'active':''}" data-goto="${v.id}"${on?' aria-current="page"':''}><span class="nb-wrap">${ic(v.i,'width:20px;height:20px')}</span>${v.l}</button>`}).join('');

}

function renderStale(){const el=$('#stale');if(!DATA){el.innerHTML='';return}
  const h=(Date.now()-new Date(DATA.generated))/36e5;
  if(FROMCACHE||!navigator.onLine)el.innerHTML=`<div class="note-bar warn">${ic('cloud')}<span>Offline – du siehst die zuletzt geladenen Daten vom ${fmtStamp(DATA.generated)}.</span></div>`;
  else if(h>30)el.innerHTML=`<div class="note-bar warn">${ic('clock')}<span>Die Daten sind ${ago(DATA.generated)} entstanden – die Analyse ist evtl. nicht gelaufen.</span></div>`;
  else el.innerHTML=''}

/* ===== Bausteine ===== */
const badge=o=>{const k=sigEff(o);return `<span class="sb s-${sigCls(k)}">${k}</span>`};
const sigBadgeK=k=>`<span class="sb s-${sigCls(k)}">${k}</span>`;
const chg=(x,dec=1)=>x==null?'<span class="chip neutral">–</span>':`<span class="chip ${x>0?'up':x<0?'down':'neutral'}">${pct(x,dec)}</span>`;
function mono(o){const t=o.t.replace(/[-.].*$/,'');const c=o.ty==='Krypto'?'kr':o.ty==='ETF/ETP'?'etf':'stk';return `<span class="mono ${c}" aria-hidden="true">${esc(t.slice(0,4))}</span>`}
function sparkSvg(a,w=120,h=36){a=(a||[]).filter(v=>v!=null);if(a.length<2)return '';const mn=Math.min(...a),mx=Math.max(...a),rg=mx-mn||1;
  const pts=a.map((v,i)=>`${(i/(a.length-1)*w).toFixed(1)},${(h-3-(v-mn)/rg*(h-6)).toFixed(1)}`).join(' ');const up=a[a.length-1]>=a[0];
  return `<svg class="spk ${up?'up':'down'}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>`}
function tradeLine(o,stake){if(!o.pl)return '';const t=trade(stake,o.pl.up,o.pl.dn,o);
  return `<div class="tl num">Einsatz ${chf(stake,0)} → <b class="${t.gain>0?'pos':'negv'}">Ziel ${chfS(t.gain)}</b> netto nach Gebühren, <b class="negv">Risiko ${chf(t.loss)}</b></div>`}
function instRow(o,{showTrade=true}={}){const st=stakeOf(o);const k=sigEff(o);
  return `<button class="ir" data-open="${esc(o.t)}"><span class="ir-l">${mono(o)}<span class="ir-m"><span class="ir-n">${esc(o.n)}${S.watch.includes(o.t)?ic('starFill','width:13px;height:13px;color:var(--warn);margin-left:6px;vertical-align:-1px'):''}</span><span class="ir-s">${esc(o.t)} · ${esc(o.ty)} · ${esc(o.rg)}${o.sec&&o.ty==='Aktie'?' · '+esc(o.sec):''}</span>${showTrade&&k==='Kaufzone'?tradeLine(o,st):''}</span></span>
  <span class="ir-r"><span class="ir-p num">${chf(o.pc)}</span><span class="ir-c">${chg(o.d1)}${badge(o)}</span></span></button>`}

    <div class="card kpi span-3"><div class="kpi-top"><span class="kpi-ico" style="background:var(--mint-soft);color:var(--mint)">${ic('coins')}</span>Dein Einsatz</div><div class="kpi-val num"><span class="cur">CHF</span>${grp(stake,0)}</div><div class="kpi-foot">Ziel-Gewinn ${chf(S.settings.goal,0)} · <button class="link-btn" data-goto="settings">ändern</button></div></div>
    <div class="card kpi span-3"><div class="kpi-top"><span class="kpi-ico" style="background:var(--warn-soft);color:var(--warn)">${ic('percent')}</span>Rückblick-Test</div><div class="kpi-val num">${bt.n?pct(bt.ziel,0,false):'–'}<span class="cur" style="margin-left:6px">Ziel erreicht</span></div><div class="kpi-foot">${bt.n?`${grp(bt.n,0)} Signale · Stopp ${pct(bt.stopp,0,false)}`:'noch keine Daten'}</div></div>
    <div class="card kpi span-3"><div class="kpi-top"><span class="kpi-ico" style="background:var(--input);color:var(--text2)">${ic('activity')}</span>Live-Bilanz</div><div class="kpi-val num">${live.n>=live.min?pct(live.ziel,0,false):`${live.n||0}<span class="cur" style="margin-left:6px">/ ${live.min||20} ausgewertet</span>`}</div><div class="kpi-foot">${live.n>=live.min?`Ziel erreicht bei ${live.n} Signalen`:`${live.open||0} offene Signale werden verfolgt`}</div></div>
  </div>

    <div class="card span-7" style="--i:3"><div class="card-head"><div><div class="card-title">Top-Chancen heute</div><div class="card-sub">Sortiert nach erwartetem Netto-Ergebnis in CHF für deinen Einsatz – nach Yuh-Gebühren</div></div><button class="link-btn" data-sig-go="Kaufzone">Alle →</button></div>${topHtml}${posNote}</div>
    <div class="card span-5" style="--i:4"><div class="card-head"><div><div class="card-title">Signalverteilung</div><div class="card-sub">${D.count} Instrumente · Profil «${PROFILES[S.settings.risk].l}»</div></div></div>
      <div class="dist" role="img" aria-label="Verteilung der Signale">${dist.map(s=>s.n?`<span class="s-${s.c}" style="flex:${s.n}"></span>`:'').join('')}</div>
      <div class="dist-leg">${dist.map(s=>`<button data-sig-go="${s.k}"><i class="s-${s.c}"></i><span><b>${s.k}</b><small>${s.d}</small></span><span class="num">${s.n}<small>${Math.round(s.n/tot*100)} %</small></span></button>`).join('')}</div></div>
  </div>
  ${posSummary()}
  <div class="card" style="--i:6;margin-bottom:20px"><div class="card-head"><div><div class="card-title">Ehrliche Bilanz der Regeln</div><div class="card-sub">Rückblick-Test über rund 12 Monate: jedes Setup mit Ziel/Stopp wie heute berechnet, ohne Fundamentaldaten</div></div></div>${btTable()}</div>
  <p class="set-foot">${esc(D.universe.note)}</p>`;
}
function btTable(){const B=DATA.backtest||{};const rows=['all','pullback','momentum','rebound','breakout'].filter(k=>B[k]&&B[k].n);
  if(!rows.length)return '<div class="soft-empty">Noch keine Auswertung vorhanden.</div>';
  return `<div class="tbl-wrap"><table class="tbl num"><thead><tr><th>Setup</th><th>Signale</th><th>Ziel erreicht</th><th>Stopp</th><th>Zeit abgelaufen</th><th>Ø brutto</th><th>Ø netto bei CHF 100</th><th>Ø Tage</th></tr></thead><tbody>${rows.map(k=>{const b=B[k];return `<tr${k==='all'?' class="tot"':''}><td>${k==='all'?'Alle':SETUP_DE[k]}</td><td>${grp(b.n,0)}</td><td>${pct(b.ziel,0,false)}</td><td>${pct(b.stopp,0,false)}</td><td>${pct(b.ablauf,0,false)}</td><td class="${b.ret>0?'pos':'negv'}">${pct(b.ret,2)}</td><td class="${b.avg100>0?'pos':'negv'}">${chfS(b.avg100)}</td><td>${grp(b.avgdays,0)}</td></tr>`}).join('')}</tbody></table></div>
  <p class="set-note">${ic('info')}<span>So ehrlich wie möglich: Die Setups bringen im Schnitt nur einen kleinen Brutto-Vorteil. Bei kleinen Einsätzen fressen die Yuh-Gebühren (mind. CHF 1 je Kauf und Verkauf, 0.95 % Devisenzuschlag je Richtung bei USD/EUR-Titeln) diesen Vorteil oft auf. Vergangene Ergebnisse sind keine Garantie. Die Live-Bilanz wird ab ${(DATA.live&&DATA.live.min)||20} ausgewerteten Signalen angezeigt.</span></p>`}
function posSummary(){if(!S.pos.length||!DATA)return '';let inv=0,net=0;const rows=S.pos.map(p=>{const o=BY[p.t];if(!o)return '';const v=posVal(p,o);inv+=p.stake;net+=v.net;return instRow(o,{showTrade:false})}).join('');
  return `<div class="card" style="--i:5;margin-bottom:20px"><div class="card-head"><div><div class="card-title">Meine Positionen</div><div class="card-sub">Eingesetzt ${chf(inv,0)} · beim Verkauf heute netto ca. <b class="${net>=0?'pos':'negv'}">${chfS(net)}</b></div></div><button class="link-btn" data-goto="pos">Alle →</button></div>${rows}</div>`}

/* ===== Signale-Liste ===== */
const F={q:'',sig:'all',type:'',region:'',sector:'',sort:'ev'};
const fold=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function fillSelects(){if(!DATA)return;const I=DATA.instruments;
  const opt=(id,label,vals)=>{const el=$(id);const cur=el.value;el.innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');el.value=vals.includes(cur)?cur:''};
  const uniq=f=>[...new Set(I.map(f).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));
  opt('#fType','Alle Typen',uniq(o=>o.ty));opt('#fRegion','Alle Regionen',uniq(o=>o.rg));opt('#fSector','Alle Sektoren',uniq(o=>o.sec))}
function filtered(){if(!DATA)return[];const q=fold(F.q).trim();
  let L=DATA.instruments.filter(o=>(F.sig==='all'||sigEff(o)===F.sig)&&(!F.type||o.ty===F.type)&&(!F.region||o.rg===F.region)&&(!F.sector||o.sec===F.sector)&&(!q||fold(o.n+' '+o.t).includes(q)));
  const evs=o=>o.pl&&sigEff(o)==='Kaufzone'?ev(o,stakeOf(o)):null;
  const rank=o=>({Kaufzone:0,Beobachten:2,Halten:1,'Überhitzt':3,Meiden:4})[sigEff(o)];
  if(F.sort==='ev')L.sort((a,b)=>rank(a)-rank(b)||((evs(b)??-1e9)-(evs(a)??-1e9))||b.sc-a.sc);
  if(F.sort==='score')L.sort((a,b)=>b.sc-a.sc);
  if(F.sort==='d1')L.sort((a,b)=>(b.d1??-9)-(a.d1??-9));
  if(F.sort==='name')L.sort((a,b)=>a.n.localeCompare(b.n,'de'));
  return L}
let listLimit=60;
function renderList(){
  if(!DATA){$('#list').innerHTML=`<div class="empty"><div class="e-ico">${ic('refresh')}</div><strong>Keine Daten</strong>${LOADERR?esc(LOADERR):'Laden …'}</div>`;return}
  const all=DATA.instruments;
  $('#sigChips').innerHTML=[{k:'all',c:'',n:all.length,l:'Alle'},...SIGS.map(s=>({k:s.k,c:s.c,l:s.k,n:all.filter(o=>sigEff(o)===s.k).length}))].map(s=>`<button class="fchip" data-sig="${s.k}" aria-pressed="${F.sig===s.k}">${s.c?`<i class="s-${s.c}"></i>`:''}${s.l} <span class="num" style="opacity:.6">${s.n}</span></button>`).join('');
  const L=filtered();
  $('#listSum').innerHTML=`<b>${L.length}</b> Treffer${F.sig==='Kaufzone'?` · Einsatz je Titel ${chf(S.settings.stake,0)} (pro Titel änderbar)`:''}${(F.q||F.sig!=='all'||F.type||F.region||F.sector)?` · <button class="link-btn" data-action="clearfilter">Filter zurücksetzen</button>`:''}`;
  $('#list').innerHTML=L.length?L.slice(0,listLimit).map(o=>instRow(o)).join('')+(L.length>listLimit?`<div style="text-align:center;padding:14px"><button class="btn btn-secondary" data-action="more">${L.length-listLimit} weitere anzeigen</button></div>`:''):`<div class="empty"><div class="e-ico">${ic('search')}</div><strong>Keine Treffer</strong>Andere Suche oder Filter versuchen.</div>`;
}
