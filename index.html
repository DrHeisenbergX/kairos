function toggleWatch(t){const i=S.watch.indexOf(t);if(i>=0){S.watch.splice(i,1);toast('Von der Watchlist entfernt')}else{S.watch.push(t);toast('Zur Watchlist hinzugefügt')}refresh()}
function renderWatch(){const el=$('#watchView');
  if(!S.watch.length){el.innerHTML=`<div class="card"><div class="big-empty"><div class="be-ico">${ic('star')}</div><h3>Deine Watchlist ist leer</h3><p>Öffne ein Instrument und tippe auf den Stern – hier siehst du dann alle beobachteten Titel mit ihrem aktuellen Signal.</p><button class="btn btn-primary" data-goto="signals">${ic('activity','width:16px;height:16px')}Signale ansehen</button></div></div>`;return}

/* ===== Positionen ===== */
function posVal(p,o){const fxNow=o.fx||1,fxBuy=p.fx||fxNow;const inv=p.stake-feeSide(p.stake,o);const units=inv/(p.buy*fxBuy);const val=units*o.p*fxNow;const net=val-feeSide(val,o)-p.stake;return{val,net,units,ret:o.p/p.buy-1}}
function posHint(o,p){const k=o.sig;if(k==='Überhitzt')return{c:'warn',t:'Überhitzt – Teilgewinne mitnehmen oder Stopp nachziehen prüfen.'};if(k==='Meiden')return{c:'danger',t:'Abwärtstrend – Ausstieg oder engen Stopp prüfen.'};if(k==='Kaufzone')return{c:'ok',t:'Aktuell Kaufzone-Setup – Position halten, Aufstocken nur mit Plan.'};if(k==='Halten')return{c:'ok',t:'Trend intakt – halten.'};return{c:'muted',t:'Gemischtes Bild – beobachten.'}}
function renderPos(){const el=$('#posView');
  if(!S.pos.length){el.innerHTML=`<div class="card"><div class="big-empty"><div class="be-ico">${ic('briefcase')}</div><h3>Noch keine Positionen erfasst</h3><p>Trage ein, was du bei Yuh hältst (Einsatz in CHF und Kaufkurs). Kairos zeigt dir dann das aktuelle Signal, den Wert und das Netto-Ergebnis nach Verkaufsgebühren. Alles bleibt lokal auf diesem Gerät.</p><button class="btn btn-primary" data-action="addpos">${ic('plus','width:16px;height:16px')}Position erfassen</button></div></div>`;return}
  let inv=0,net=0;
  const rows=S.pos.map(p=>{const o=BY[p.t];if(!o)return `<div class="pos-row"><div class="ir-m"><span class="ir-n">${esc(p.t)}</span><span class="ir-s">Keine aktuellen Daten</span></div><button class="icon-btn" data-delpos="${p.id}" aria-label="Löschen">${ic('trash')}</button></div>`;
    const v=posVal(p,o);inv+=p.stake;net+=v.net;const h=posHint(o,p);
    return `<div class="pos-row"><button class="pos-main" data-open="${esc(o.t)}">${mono(o)}<span class="ir-m"><span class="ir-n">${esc(o.n)}</span><span class="ir-s num">Einsatz ${chf(p.stake,0)} · Kauf ${money(p.buy,o.ccy)}${p.date?' · '+dmy(p.date):''}</span><span class="pos-h ${h.c}">${h.t}</span></span></button>
      <div class="pos-r"><span class="num">${chf(v.val)}</span><span class="num ${v.net>=0?'pos':'negv'}" title="Netto nach Verkaufsgebühren">${chfS(v.net)}</span>${badge(o)}</div>
      <div class="pos-act"><button class="icon-btn" data-editpos="${p.id}" aria-label="Bearbeiten">${ic('edit')}</button><button class="icon-btn" data-delpos="${p.id}" aria-label="Löschen">${ic('trash')}</button></div></div>`}).join('');
  el.innerHTML=`<div class="card"><div class="card-head"><div><div class="card-title">Bei Yuh gehalten</div><div class="card-sub num">Eingesetzt ${chf(inv,0)} · Netto bei Verkauf heute ca. <b class="${net>=0?'pos':'negv'}">${chfS(net)}</b></div></div><button class="btn btn-primary btn-sm" data-action="addpos">${ic('plus','width:16px;height:16px')}Position</button></div>${rows}
  <p class="set-note">${ic('info')}<span>Wert = Stückzahl aus Einsatz (nach Kaufgebühr) × aktueller Kurs in CHF. Bei Fremdwährung wird der Wechselkurs beim Erfassen verwendet. «Netto» berücksichtigt die geschätzte Verkaufsgebühr. Angaben ohne Gewähr – massgebend ist die Yuh-App.</span></p></div>`}
function openPosForm(id,pre){const p=id?S.pos.find(x=>x.id===id):null;const o0=p?BY[p.t]:pre?BY[pre]:null;
  const opts=DATA?DATA.instruments.slice().sort((a,b)=>a.n.localeCompare(b.n,'de')).map(o=>`<option value="${esc(o.t)}"${o0&&o0.t===o.t?' selected':''}>${esc(o.n)} (${esc(o.t)})</option>`).join(''):'';
  openModal(`${mHead(p?'Position bearbeiten':'Position erfassen','Was du bei Yuh gekauft hast – bleibt lokal gespeichert')}<form id="pf" novalidate>
   <div class="field"><label for="pT">Instrument</label><select class="input" id="pT">${opts}</select></div>
   <div class="field-row"><div class="field"><label for="pS">Einsatz in CHF</label><input class="input num" id="pS" inputmode="decimal" value="${p?p.stake:S.settings.stake}"><div class="err"></div></div>
   <div class="field"><label for="pB">Kaufkurs <span class="opt" id="pCcy"></span></label><input class="input num" id="pB" inputmode="decimal" value="${p?p.buy:o0?o0.p:''}"><div class="err"></div></div></div>
   <div class="field"><label for="pD">Kaufdatum <span class="opt">optional</span></label><input class="input" id="pD" type="date" value="${p?p.date:new Date().toISOString().slice(0,10)}"></div>
   ${actions(p?'Speichern':'Erfassen')}</form>`,m=>{
    const upd=()=>{const o=BY[$('#pT',m).value];$('#pCcy',m).textContent=o?'in '+o.ccy:'';if(!p&&o)$('#pB',m).value=o.p};
    $('#pT',m).onchange=upd;$('#pCcy',m).textContent=o0?'in '+o0.ccy:(DATA?'in '+DATA.instruments[0].ccy:'');if(!o0)upd();
    $('#pf',m).onsubmit=e=>{e.preventDefault();const t=$('#pT',m).value,o=BY[t];const st=parseAmt($('#pS',m).value),b=parseAmt($('#pB',m).value);
      if(!o)return;if(!(st>=1&&st<1e7))return invalid($('#pS',m),'Bitte einen Einsatz in CHF eingeben, z. B. 100.');if(!(b>0&&b<1e9))return invalid($('#pB',m),'Bitte den Kaufkurs eingeben.');
      const rec={id:p?p.id:uid(),t,stake:st,buy:b,fx:p&&p.t===t?p.fx:o.fx,date:$('#pD',m).value||'',note:''};
      if(p)S.pos[S.pos.indexOf(p)]=rec;else S.pos.push(rec);closeModal();refresh();toast(p?'Position gespeichert':'Position erfasst')}})}
function delPos(id){const p=S.pos.find(x=>x.id===id);if(!p)return;const k=S.pos.indexOf(p);S.pos.splice(k,1);refresh();toast('Position gelöscht',{label:'Rückgängig',fn:()=>{S.pos.splice(k,0,p);refresh()}})}

/* ===== Toasts, Thema ===== */
function toast(msg,action,kind){const el=document.createElement('div');el.className='toast'+(kind?' '+kind:'');el.setAttribute('role','status');msg=String(msg);if(msg.length>160)msg=msg.slice(0,157)+'…';el.innerHTML=`<span class="t-ico">${ic(kind==='warn'?'info':'check')}</span><span>${esc(msg)}</span>${action?`<button type="button">${action.label}</button>`:''}`;$('#toasts').appendChild(el);{const live=$$('#toasts .toast:not(.out)');if(live.length>3)live[0]._kill(true)}let done=false;const kill=()=>{if(done)return;done=true;clearTimeout(tm);el.classList.add('out');setTimeout(()=>el.remove(),350)};el._kill=kill;if(action)el.querySelector('button').onclick=()=>{action.fn();kill()};const tm=kind==='sticky'?0:setTimeout(kill,action?6000:kind==='warn'?5000:3200)}
function setTheme(t,save=true){if(t!=='dark'&&t!=='light')t='dark';document.documentElement.setAttribute('data-theme',t);$$('[data-theme-set]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeSet===t)));$('#mThemeBtn').innerHTML=ic(t==='dark'?'sun':'moon');$$('meta[name=theme-color]').forEach(mt=>mt.setAttribute('content',t==='dark'?'#070a13':'#f3f5fa'));if(save)try{localStorage.setItem(THEME_KEY,t)}catch(e){}}
let savedTheme=null;try{savedTheme=localStorage.getItem(THEME_KEY)}catch(e){}
const qTheme=new URLSearchParams(location.search).get('theme');
setTheme(qTheme||savedTheme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'),!qTheme);
function installHint(){
  const standalone=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
  let dismissed=false;try{dismissed=localStorage.getItem(HINT_KEY)==='1'}catch(e){}
  const box=$('#installHint');if(!box)return;
  if(!IOS||standalone||dismissed||!/^https?:$/.test(location.protocol)){box.hidden=true;return}
  box.hidden=false;box.innerHTML=`<span class="ih-ico" aria-hidden="true"></span><div style="flex:1;min-width:0"><div class="ih-t">Kairos als App installieren</div><div class="ih-s">Tippe auf ${ic('share')} <b>Teilen</b> und dann auf <b>«Zum Home-Bildschirm»</b>.</div></div><button class="icon-btn" data-action="hint-close" aria-label="Hinweis schliessen">${ic('x','width:16px;height:16px')}</button>`}

/* ===== Ereignisse ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-goto],[data-action],[data-close],[data-open],[data-sig],[data-sig-go],[data-range],[data-theme-set],[data-star],[data-delpos],[data-editpos]');if(!t)return;
  if(t.hasAttribute('data-close'))return closeModal();
  if(t.dataset.goto){closeModal();return go(t.dataset.goto)}
  if(t.dataset.open)return openDetail(t.dataset.open);
  if(t.dataset.sig){F.sig=t.dataset.sig;listLimit=60;return renderList()}
  if(t.dataset.sigGo){F.sig=t.dataset.sigGo;listLimit=60;return go('signals')}
  if(t.dataset.range){chartRange=t.dataset.range;$$('[data-range]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.range===chartRange)));const o=BY[detailT];if(o)loadHist(o).then(h=>drawChart(o,h));return}
  if(t.dataset.themeSet)return setTheme(t.dataset.themeSet);
  if(t.dataset.star){toggleWatch(t.dataset.star);if($('#modalRoot').classList.contains('open')&&detailT===t.dataset.star)rerenderDetail();return}
  if(t.dataset.delpos)return delPos(t.dataset.delpos);
  if(t.dataset.editpos)return openPosForm(t.dataset.editpos);
  const a=t.dataset.action;
  if(a==='theme')return setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
  if(a==='reload')return reload(true);
  if(a==='more'){listLimit+=120;return renderList()}
  if(a==='clearfilter'){Object.assign(F,{q:'',sig:'all',type:'',region:'',sector:''});$('#q').value='';fillSelects();return renderList()}
  if(a==='addpos'){if(!DATA)return toast('Noch keine Daten geladen',null,'warn');return openPosForm(null,t.dataset.pre)}
  if(a==='savestake')return saveStake();
  if(a==='resetstakes'){S.stakes={};refresh();return toast('Eigene Einsätze zurückgesetzt')}
  if(a==='stakereset'){delete S.stakes[detailT];persist();rerenderDetail();return renderView(current)}
  if(a==='export')return exportData();
  if(a==='import')return $('#importInput').click();
  if(a==='wipe')return openConfirm('Alle lokalen Daten löschen?','Watchlist, Positionen und Einstellungen werden von diesem Gerät entfernt. Die Marktdaten bleiben verfügbar.','Löschen',()=>{S=sanitize(null);refresh();toast('Lokale Daten gelöscht')});
  if(a==='hint-close'){try{localStorage.setItem(HINT_KEY,'1')}catch(_){}$('#installHint').hidden=true;return}
});
$('#q').addEventListener('input',e=>{F.q=e.target.value;listLimit=60;renderList()});
[['#fType','type'],['#fRegion','region'],['#fSector','sector'],['#fSort','sort']].forEach(([s,k])=>$(s).addEventListener('change',e=>{F[k]=e.target.value;listLimit=60;renderList()}));
$('#importInput').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';importData(f)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==current&&VIEWS.find(v=>v.id===h))go(h)});
addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{S=sanitize(JSON.parse(e.newValue));refresh()}catch(_){}}});
addEventListener('online',()=>reload(false));addEventListener('offline',renderStale);
let lastLoad=0;
async function reload(manual){const btn=$('#reloadBtn');btn&&btn.classList.add('spin');const old=DATA&&DATA.generated;await loadData();lastLoad=Date.now();btn&&btn.classList.remove('spin');fillSelects();setHeader();buildNav();renderView(current);
  if(manual)toast(LOADERR?'Aktualisierung fehlgeschlagen – zeige letzte Daten':DATA.generated!==old?'Neue Signale geladen':'Daten sind aktuell',null,LOADERR?'warn':null)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastLoad>10*60*1000)reload(false)});
setInterval(()=>{if(document.visibilityState==='visible')reload(false)},30*60*1000);
if(/^https?:$/.test(location.protocol)&&'serviceWorker' in navigator){
  const hadCtrl=!!navigator.serviceWorker.controller;let reloading=false,shown=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtrl||reloading)return;
    const busy=$('#modalRoot').classList.contains('open');
    if(performance.now()<10000&&!busy){reloading=true;location.reload();return}
    if(shown)return;shown=true;toast('Neue Version verfügbar',{label:'Neu laden',fn:()=>{reloading=true;location.reload()}},'sticky')});
  addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    const check=()=>reg.update().catch(()=>{});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});setInterval(check,30*60*1000);
  }).catch(err=>console.info('Service Worker nicht registriert',err))})}
window.Kairos={version:APP_VERSION,engine:{feeSide,feeParts,trade,ev,minStake,stakeFor,sanitize,fits,sigEff},get data(){return DATA},get state(){return S}};

buildNav();setHeader();renderView('dashboard');installHint();
LOAD_WARN.forEach(w=>setTimeout(()=>toast(w,null,'warn'),600));
reload(false).then(()=>{const st=(location.hash||'').slice(1);if(st&&st!=='dashboard'&&VIEWS.find(v=>v.id===st))go(st)});

})();
</script>
</body>
</html>
